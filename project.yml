name: ScrollSnap
options:
  bundleIdPrefix: com.ruohui
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0.0"

targets:
  ScrollSnap:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ScrollSnap
      - path: Shared
    dependencies:
      - target: ScrollSnapBroadcast
      - target: ScrollSnapWidget
    info:
      path: ScrollSnap/Resources/Info.plist
    entitlements:
      path: ScrollSnap/ScrollSnap.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruohui.scrollsnap
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: ScrollSnap/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ScrollSnap/ScrollSnap.entitlements

  ScrollSnapBroadcast:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ScrollSnapBroadcast
      - path: Shared
    info:
      path: ScrollSnapBroadcast/Info.plist
    entitlements:
      path: ScrollSnapBroadcast/ScrollSnapBroadcast.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruohui.scrollsnap.broadcast
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: ScrollSnapBroadcast/Info.plist
        CODE_SIGN_ENTITLEMENTS: ScrollSnapBroadcast/ScrollSnapBroadcast.entitlements

  ScrollSnapWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ScrollSnapWidget
      - path: Shared
    info:
      path: ScrollSnapWidget/Info.plist
    entitlements:
      path: ScrollSnapWidget/ScrollSnapWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruohui.scrollsnap.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: ScrollSnapWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: ScrollSnapWidget/ScrollSnapWidget.entitlements
